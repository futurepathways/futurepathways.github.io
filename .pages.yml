  - name: tags-subject
    label: 'Tags: Subject area'
    type: collection
    path: src/data/tags/subject
    format: yaml
    exclude:
      - _*
    filename:
      template: '{slug}.yml'
      field: create
    view:
      fields:
        - title
        - description
      primary: title
      sort:
        - title
    fields:
      - name: slug
        label: Slug (file name)
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
        description: >-
          Lowercase letters, numbers and hyphens only, for example data-ai. Becomes the file name and the web address.
          Never change it later.
      - name: title
        label: Tag name
        type: string
        required: true
        description: What students see, for example Data and AI.
      - name: description
        label: One line description
        type: string
        description: Shown on the tag page. The field the post is about.
      - name: search
        label: Search words
        type: string
        list: true
        description: Other words students might type for this tag, for example "artificial intelligence". Used only by search.
