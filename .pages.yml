# Pages CMS configuration for Future Pathways (https://pagescms.org).
# Generated by scripts/make-pages-config.mjs. Edit that file and run `npm run cms`; do not edit this file by hand.
media:
  - name: images
    label: Images
    input: src/images/uploads
    output: ../../images/uploads
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg
    rename: safe
content:
  - name: careers
    label: Careers
    type: collection
    path: src/content/careers
    exclude:
      - _*
    filename:
      template: '{title}.md'
      field: create
    view:
      fields:
        - title
        - status
        - published_date
        - reviewed_by
      primary: title
      sort:
        - published_date
        - title
      default:
        sort: published_date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The heading of the post. Plain and clear.
      - name: summary
        label: Summary
        type: text
        required: true
        description: One or two sentences for the card and search results. At most 160 characters.
        options:
          maxlength: 160
          rows: 2
      - name: main_category
        label: Main category
        type: select
        required: true
        default: careers
        readonly: true
        description: Set by the folder this post is in. Do not change.
        options:
          values:
            - name: careers
              label: Careers
            - name: opportunities
              label: Internships & Opportunities
            - name: courses
              label: Courses
            - name: countries
              label: Countries
            - name: universities
              label: Universities
      - name: extra_categories
        label: Also show in (optional)
        type: select
        description: Up to 2 other categories this post also belongs to. Not the main category.
        options:
          multiple: true
          max: 2
          values:
            - name: careers
              label: Careers
            - name: opportunities
              label: Internships & Opportunities
            - name: courses
              label: Courses
            - name: countries
              label: Countries
            - name: universities
              label: Universities
      - name: grade_band
        label: Grade band
        type: select
        required: true
        description: Pick every grade band this post is for. At least one.
        options:
          multiple: true
          min: 1
          values:
            - name: 6-8
              label: Grades 6 to 8
            - name: 9-10
              label: Grades 9 and 10
            - name: 11-12
              label: Grades 11 and 12
      - name: streams
        label: Stream (optional)
        type: select
        description: Which streams this post suits. "Any stream" shows it under every stream filter.
        options:
          multiple: true
          values:
            - name: science
              label: Science
            - name: commerce
              label: Commerce
            - name: humanities
              label: Humanities
            - name: any
              label: Any stream
      - name: tags_subject
        label: 'Tags: Subject area'
        type: reference
        description: Pick at least one. What field is this post about?
        options:
          collection: tags-subject
          multiple: true
          search: name,fields.title,fields.search
          value: '{name}'
          label: '{fields.title}'
          min: 1
      - name: tags_exam
        label: 'Tags: Entrance exam (optional)'
        type: reference
        description: Tests mentioned in the post.
        options:
          collection: tags-exam
          multiple: true
          search: name,fields.title,fields.search
          value: '{name}'
          label: '{fields.title}'
      - name: tags_skill
        label: 'Tags: Skill (optional)'
        type: reference
        description: Skills the post helps build.
        options:
          collection: tags-skill
          multiple: true
          search: name,fields.title,fields.search
          value: '{name}'
          label: '{fields.title}'
      - name: tags_level
        label: 'Tags: Study level (optional)'
        type: reference
        description: 'Where the student is headed: school, undergraduate, postgraduate, diploma.'
        options:
          collection: tags-level
          multiple: true
          search: name,fields.title,fields.search
          value: '{name}'
          label: '{fields.title}'
      - name: tags_audience
        label: 'Tags: Audience (optional)'
        type: reference
        description: 'Who the post speaks to. Add "Parents" if it is written for parents. All tag fields together: 3 to 8 tags.'
        options:
          collection: tags-audience
          multiple: true
          search: name,fields.title,fields.search
          value: '{name}'
          label: '{fields.title}'
      - name: countries
        label: Countries (optional)
        type: reference
        description: Countries the post is about.
        options:
          collection: country-list
          multiple: true
          search: name,fields.title,fields.search
          value: '{name}'
          label: '{fields.title}'
      - name: parent_summary
        label: For Parents box
        type: text
        required: true
        description: >-
          2 to 4 plain sentences for parents: what this is, rough cost, the key date, and one question to ask the FP
          counsellor.
        options:
          rows: 4
      - name: official_links
        label: Official links (optional)
        type: object
        list: true
        description: The official pages a reader should check before applying or paying.
        fields:
          - name: label
            label: Link text
            type: string
            required: true
          - name: url
            label: Web address
            type: string
            required: true
            pattern: ^https?://
      - name: cover_image
        label: Cover image (optional)
        type: image
        description: >-
          Only free stock photos (Unsplash, Pexels) or TIPS photos with permission. Leave empty to use the category
          picture.
        options:
          media: images
          path: posts
          extensions:
            - jpg
            - jpeg
            - png
            - webp
      - name: cover_alt
        label: Cover image description
        type: string
        description: Required if there is a cover image. Describe the picture in plain words for people who cannot see it.
      - name: image_credit
        label: Image credit (optional)
        type: string
        description: 'For example: Photo by Jane Doe on Unsplash.'
      - name: author
        label: Written by
        type: string
        description: The counsellor who wrote the post.
      - name: reviewed_by
        label: Checked by
        type: string
        description: The counsellor who checked every fact, figure and link. A post should not be published without this.
      - name: last_checked
        label: Last checked
        type: date
        required: true
        description: The date the facts were last checked.
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        description: Drafts are saved but not shown on the site. Switch to Published when it is checked and ready.
        options:
          values:
            - name: draft
              label: Draft (not on the site)
            - name: published
              label: Published (live)
      - name: published_date
        label: Published on
        type: date
        required: true
        description: Used to order posts, newest first.
      - name: body
        label: Post text
        type: rich-text
        description: >-
          Follow the Careers template headings. Mark every fee, salary, cut-off and deadline "approximate" and link the
          official page.
        options:
          media: images
          path: posts
