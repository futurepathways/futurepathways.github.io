# Future Pathways tag list (PRD 7.3).
#
# Every tag has:
#   slug:        used in the page address, lowercase, hyphens only, never changes
#   name:        what students see
#   group:       subject | exam | skill | level | audience
#   description: one friendly line, shown on the tag page
#   search:      other words students might type; used only by search, never shown
#
# To add a tag: copy a block, give it a new slug, pick the group, add search words.
# Posts may only use tags listed here. The build fails if a post uses an unknown tag.

groups:
  subject: Subject area
  exam: Entrance exam
  skill: Skill
  level: Study level
  audience: Audience

tags:
  # ---------- Subject area ----------
  - slug: engineering
    name: Engineering
    group: subject
    description: Building and designing things, from bridges and machines to software and chips.
    search: [engineer, btech, b.tech, b.e., technology, iit]
  - slug: medicine
    name: Medicine
    group: subject
    description: Becoming a doctor, dentist or other health professional.
    search: [doctor, mbbs, medical, dentist, bds, healthcare, hospital]
  - slug: allied-health
    name: Allied health
    group: subject
    description: Health careers beyond MBBS, like nursing, physiotherapy, pharmacy and lab science.
    search: [nursing, physiotherapy, pharmacy, paramedical, bsc nursing]
  - slug: design
    name: Design
    group: subject
    description: Product, fashion, graphic, UX and interior design.
    search: [designer, ux, ui, fashion, graphic design, nid, nift, product design]
  - slug: architecture
