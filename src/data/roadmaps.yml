  subjects_note: Psychology, English; Maths helps
  degrees: BA Psychology; B.Des; BA Sociology
  exams:
  - cuet
  - uceed
  - nid-dat
  exams_note: CUET-UG, UCEED, NID DAT
  routes: BA Psychology or Sociology (CUET-UG); B.Des (UCEED, NID DAT).
