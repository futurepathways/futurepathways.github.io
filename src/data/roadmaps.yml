- slug: management-consultant
  title: Management Consultant
  family: finance-consulting
  what: Help companies solve big business problems, usually in short, intense projects.
  subjects:
  - maths
  - economics
  subjects_note: Maths, Economics
  degrees: B.Tech, B.Com, BA / B.Sc Economics, IPM
  exams:
  - ipmat
  - jee
  - cuet
  - cat
  exams_note: IPMAT, JEE Main, CUET-UG; later CAT
