  phase2: Interaction design, visual design (type, colour, layout), wireframes and prototypes in Figma.
  phase3: Design systems, accessibility, usability testing, handing designs to developers, a strong portfolio, designing
    for AI.
  project: Redesign one screen of a school or local service app, with before and after and the reasons.
  source: https://careermaxxing.kungumavishnu.com/roadmap/ui-ux-designer
- slug: ux-researcher
